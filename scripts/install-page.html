<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}" />
    <title>Add {{APP_NAME}} to your Home Screen</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f8; color: #171717; }
      main { width: min(680px, calc(100% - 40px)); padding: 32px; border-radius: 24px; background: white; box-sizing: border-box; }
      h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 44px); line-height: 1.05; }
      p { line-height: 1.6; color: #555; }
      ol { padding-left: 24px; line-height: 2; }
      a { display: inline-block; margin-top: 16px; padding: 12px 18px; border-radius: 12px; background: #171717; color: white; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Add {{APP_NAME}} to your Home Screen</h1>
      <p>On iPhone or iPad, open the Share menu in Safari and choose <strong>Add to Home Screen</strong>.</p>
      <ol>
        <li>Open this page in Safari.</li>
        <li>Tap the Share button.</li>
        <li>Select <strong>Add to Home Screen</strong>.</li>
      </ol>
      <a href="{{APP_URL}}">Open {{APP_NAME}}</a>
    </main>
  </body>
</html>
